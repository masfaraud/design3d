name: Build and Test Python Package

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          lfs: true

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pre-commit

      - name: Run Pre-commit Hooks
        run: |
          pre-commit run --all-files

      - name: Install Package
        run: |
          python -m pip install -v --no-cache-dir '.[test,doc]'

      - name: Run Tests and Scripts
        run: |
          coverage run \
            --rcfile=.coveragerc \
            --data-file=.coverage \
            --source=design3d \
            -m unittest discover -v tests

          coverage run \
            --rcfile=.coveragerc \
            --data-file=.coverage \
            --source=design3d \
            -a scripts/ci_scripts.py

          coverage report

      - name: Check Coverage Thresholds
        run: |
          coverage json --data-file=.coverage -o coverage.json
          python check_coverage.py coverage.json

      - name: Build Docs
        run: |
          make -C docs html SPHINXOPTS="-W --keep-going"

  sdist:
    # Builds the source distribution and installs it in a fresh environment, to catch packaging errors (a file
    # missing from MANIFEST.in, a wrong metadata) before a release.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Install from sdist
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/pip" install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-venv/bin/python" -c "import design3d, design3d.nurbs.core; print(design3d.__version__)"
