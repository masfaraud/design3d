name: Build and Test Python Package

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pre-commit

      - name: Run Pre-commit Hooks
        run: |
          pre-commit run --all-files

      - name: Install Package
        run: |
          python -m pip install -v --no-cache-dir '.[test]'

      - name: Run Tests and Scripts
        run: |
          coverage run \
            --rcfile=.coveragerc \
            --data-file=.coverage \
            --source=design3d \
            -m unittest discover -v tests

          coverage run \
            --rcfile=.coveragerc \
            --data-file=.coverage \
            --source=design3d \
            -a scripts/ci_scripts.py

          coverage report

      - name: Build Docs
        run: |
          make -C docs html
